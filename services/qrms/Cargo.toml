[package]
name = "qrms"
version = "0.1.0"
edition = "2021"
description = "Quantum Resistance Model System - Low Fidelity Prototype. Primary TEE: Aegis-TEE with optional Phala Network redundancy."

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"

# Crypto
sha2 = "0.10"
hex = "0.4"
rand = { version = "0.8", features = ["std_rng"] }  # Keep 0.8 for compatibility with multilinear-toolkit
rand_distr = "0.4"  # Distribution module (may be needed by multilinear-toolkit)

# Post-Quantum Cryptography
pqcrypto-dilithium = "0.5"
pqcrypto-sphincsplus = "0.5"
pqcrypto-traits = "0.3"
# Temporarily disabled due to AVX2 compilation issues
# pqcrypto-kyber = "0.5"
# pqcrypto-hqc = "0.2"

# ECDSA for hybrid signatures
k256 = "0.13"
ecdsa = { version = "0.17.0-rc.13", package = "ecdsa" }
signature = "2.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID for IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# TUI (for CLI)
ratatui = "0.28"
crossterm = "0.28"

# WebSocket client (for CLI)
tokio-tungstenite = "0.24"

# HTTP client (for CLI and IonQ API)
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Configuration parsing (optional, for phala_deploy)
toml = { version = "0.8", optional = true }

# LeanVM dependencies (from leanEthereum/leanMultisig)
# These are optional and enabled via the "lean-vm" feature flag
lean_vm = { git = "https://github.com/leanEthereum/leanMultisig.git", package = "lean_vm", optional = true }
xmss = { git = "https://github.com/leanEthereum/leanMultisig.git", package = "xmss", optional = true }
p3-koala-bear = { git = "https://github.com/TomWambsgans/Plonky3.git", branch = "lean-multisig", optional = true }
p3-field = { git = "https://github.com/TomWambsgans/Plonky3.git", branch = "lean-multisig", optional = true }
lean-multisig = { git = "https://github.com/leanEthereum/leanMultisig.git", optional = true }

[features]
default = []
phala = ["toml"]
lean-vm = ["lean_vm", "xmss", "p3-koala-bear", "p3-field", "lean-multisig"]  # Feature flag for leanVM integration

# Patch multilinear-toolkit to use compatible rand version
# The backend crate in multilinear-toolkit uses rand.workspace = true, so we patch at the workspace level
[patch."https://github.com/leanEthereum/multilinear-toolkit.git"]
rand = { version = "0.8", features = ["std", "std_rng"] }

[[bin]]
name = "qrms"
path = "src/main.rs"

[[bin]]
name = "qrms-cli"
path = "src/bin/qrms-cli.rs"

[[bin]]
name = "hybrid-cli"
path = "src/bin/hybrid-cli.rs"

[profile.release]
opt-level = 3
lto = true
